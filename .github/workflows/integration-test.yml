name: Integration Test

on:
  workflow_dispatch:
    inputs:
      lakefs_test_repo:
        description: 'LakeFS test repository'
        required: true
      lakefs_test_branch:
        description: 'LakeFS test branch'
        required: true
      transfer_mode:
        description: 'Transfer mode (signed_url or physical_path)'
        required: false
        default: 'signed_url'
        type: choice
        options:
          - signed_url
          - physical_path
      google_project:
        description: 'Google Cloud project for physical_path(optional)'
        required: false
        default: ''
      google_region:
        description: 'Google Cloud region for physical_path(optional)'
        required: false
        default: 'eu-west-1'

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run integration tests
        run: ./gradlew test
        env:
          LAKEFS_ACCESS_KEY: ${{ secrets.LAKEFS_ACCESS_KEY }}
          LAKEFS_SECRET_KEY: ${{ secrets.LAKEFS_SECRET_KEY }}
          LAKEFS_API_URL: ${{ secrets.LAKEFS_API_URL }}
          LAKEFS_TEST_REPO: ${{ inputs.lakefs_test_repo }}
          LAKEFS_TEST_BRANCH: ${{ inputs.lakefs_test_branch }}
          LAKEFS_TRANSFER_MODE: ${{ inputs.transfer_mode }}
          GOOGLE_PROJECT: ${{ inputs.google_project }}
          GOOGLE_REGION: ${{ inputs.google_region }}
          GOOGLE_EXT_BUCKET: ${{ inputs.google_ext_bucket }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: build/test-results/
          retention-days: 7