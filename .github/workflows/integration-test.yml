name: Integration Test

on:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run integration tests
        run: ./gradlew test
        env:
          LAKEFS_ACCESS_KEY: ${{ secrets.LAKEFS_ACCESS_KEY }}
          LAKEFS_SECRET_KEY: ${{ secrets.LAKEFS_SECRET_KEY }}
          LAKEFS_API_URL: ${{ secrets.LAKEFS_API_URL }}
          LAKEFS_TEST_REPO: ${{ secrets.LAKEFS_TEST_REPO }}
          LAKEFS_TEST_BRANCH: ${{ secrets.LAKEFS_TEST_BRANCH }}
          GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
          GOOGLE_REGION: ${{ secrets.GOOGLE_REGION }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: build/test-results/
          retention-days: 7