name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assemble

      - name: Run unit tests
        run: ./gradlew test

      - name: Run integration tests
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew test
        env:
          LAKEFS_ACCESS_KEY: ${{ secrets.LAKEFS_ACCESS_KEY }}
          LAKEFS_SECRET_KEY: ${{ secrets.LAKEFS_SECRET_KEY }}
          LAKEFS_API_URL: ${{ secrets.LAKEFS_API_URL }}
          LAKEFS_TEST_REPO: ${{ secrets.LAKEFS_TEST_REPO }}
          LAKEFS_TEST_BRANCH: ${{ secrets.LAKEFS_TEST_BRANCH }}
          GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
          GOOGLE_REGION: ${{ secrets.GOOGLE_REGION }}

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results/
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html/
          retention-days: 7

      - name: Add coverage to PR
        uses: madrapps/jacoco-report@v1.7.1
        if: github.event_name == 'pull_request'
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0